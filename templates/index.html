    <style>
      body{
        background-color: aliceblue;
      }
      .diagnosis-card {
          border-radius: 15px;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .image-preview {
          border: 2px dashed #3fbbc0;
          position: relative;
      }
      .highlight-overlay {
          position: absolute;
          border: 2px solid #ff4757;
          background: rgba(255,71,87,0.1);
          pointer-events: none;
      }
      .report-badge {
          font-size: 1.2rem;
          padding: 0.8em 1.5em;
      }
      .tool-content-area {
          display: none; 
      }
      .tool-content-area.active {
           display: block;
      }
      .tools-menu-item.active {
          
           border-radius: 4px;
      }
      

      .tools-sidebar {
          background: linear-gradient(160deg, rgba(16, 16, 48, 0.9), rgba(32, 32, 64, 0.9));
          backdrop-filter: blur(15px);
          border-right: 1px solid var(--科技蓝);
          box-shadow: 5px 0 15px rgba(0, 243, 255, 0.1);
          border-radius: 8px;
          padding: 1rem;
      }

      .tools-menu-item a {
          color: #a0a0ff;
          padding: 0.8rem;
          margin: 0.5rem 0;
          border-radius: 6px;
          transition: all 0.3s ease;
          position: relative;
          overflow: hidden;
      }

      .tools-menu-item a:before {
          content: '';
          position: absolute;
          left: -100%;
          top: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(90deg, 
              transparent, 
              rgba(0, 243, 255, 0.2), 
              transparent);
          transition: 0.5s;
      }

      .tools-menu-item.active a,
      .tools-menu-item a:hover {
          background: rgba(0, 243, 255, 0.1);
          color: var(--科技蓝);
          transform: translateX(10px);
      }

      .tools-menu-item a:hover:before {
          left: 100%;
      }

      .diagnosis-card {
          background: rgba(16, 16, 48, 0.8);
          border: 1px solid rgba(0, 243, 255, 0.3);
          border-radius: 12px;
          backdrop-filter: blur(5px);
          transition: transform 0.3s ease;
      }

      .diagnosis-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2);
      }

      .btn-tool-primary {
          background: linear-gradient(45deg, var(--电子紫), var(--科技蓝));
          border: none;
          color: white;
          position: relative;
          overflow: hidden;
          transition: 0.3s;
      }

      .btn-tool-primary:after {
          content: '';
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: linear-gradient(45deg, 
              transparent, 
              rgba(255,255,255,0.2), 
              transparent);
          transform: rotate(45deg);
          animation: btnGlow 3s infinite;
      }

      @keyframes btnGlow {
          0% { transform: rotate(45deg) translateX(-150%); }
          100% { transform: rotate(45deg) translateX(150%); }
      }

      #diagnosisChart {
          background: rgba(20, 20, 40, 0.7);
          border-radius: 8px;
          border: 1px solid var(--科技蓝);
          padding: 1rem;
      }

      .image-preview {
          position: relative;
          border: 2px solid transparent;
          border-radius: 8px;
          
      }
      
      
      @keyframes scanLine {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100%); }
      }

      .scan-effect:after {
          content: '';
          position: absolute;
          height: 2px;
          width: 100%;
          background: linear-gradient(90deg, transparent, var(--科技蓝), transparent);
          animation: scanLine 3s infinite;
      }
      .swiper-slide img {
        width: auto;
        height: 300px;
        object-fit: cover;
        display: block;
        border-radius: 8px;
    }
